name: release

# Turn a version tag into a published GitHub Release with the built app.
# Push a tag (e.g. `git tag v2.2.0 && git push origin v2.2.0`) or run this
# workflow manually and supply the tag.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, e.g. v2.2.0 (must already exist)'
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: v
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { '${{ github.event.inputs.tag }}' }
          if (-not $tag) { throw 'No tag resolved.' }
          $ver = $tag.TrimStart('v')
          "tag=$tag"   | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          "ver=$ver"   | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          Write-Host "Releasing $tag"

      - name: Build standalone + .exe
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted -ErrorAction SilentlyContinue
          ./Build-EXE.ps1 -Version '${{ steps.v.outputs.ver }}'

      - name: Package release zip + checksum
        shell: pwsh
        run: ./tools/Pack-Release.ps1 -Version '${{ steps.v.outputs.ver }}' -OutDir dist

      - name: Generate package manifests (winget + Scoop + Chocolatey)
        shell: pwsh
        run: ./tools/New-PackageManifests.ps1 -Version '${{ steps.v.outputs.ver }}'

      - name: Publish the release
        shell: pwsh
        run: |
          $tag = '${{ steps.v.outputs.tag }}'
          $ver = '${{ steps.v.outputs.ver }}'
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            # A release already exists (normally published locally by tools\Release.ps1).
            # Do NOT overwrite its assets: the committed manifests under packaging\
            # reference the published zip's SHA-256, so re-uploading a freshly built
            # zip would silently invalidate them. Leave the existing assets alone.
            Write-Host "Release $tag already exists - leaving its assets untouched."
            exit 0
          }
          $notes = "Scottimizer $ver`n`nDownload **Scottimizer-Advanced.zip**, unzip anywhere and run Scottimizer.exe.`nSee the file list below and the repository README for details."
          gh release create $tag --title "Scottimizer $ver" --notes $notes --generate-notes `
            'dist/Scottimizer-Advanced.zip' 'dist/Scottimizer-Advanced.zip.sha256'
          Write-Host "Published $tag"
          Write-Host "NOTE: this CI-built zip is now the published asset. Commit the manifests this"
          Write-Host "run generated under packaging\ (git add packaging) so they match its SHA-256."

  # Keep the self-hosted SVG badges (release version + download count) current.
  # Runs after the release exists so the GitHub API reflects the new tag/assets.
  refresh-badges:
    needs: build-and-release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Refresh self-hosted badges
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./Update-Badges.ps1
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/badges
          if (git diff --cached --quiet) {
            Write-Host "Badges already current."
            exit 0
          }
          git commit -m "Refresh SVG badges [skip ci]"
          git push origin main
